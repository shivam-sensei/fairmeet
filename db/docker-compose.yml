version: '3.8'

services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: meetup_postgis
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: fairmeet_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
